name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: mysqli, openssl
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check PHP syntax
        run: git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l

      - name: Check JavaScript syntax
        run: git ls-files -z -- '*.js' '*.cjs' '*.mjs' | xargs -0 -r -n 1 node --check

      - name: Check authentication privacy
        run: php tests/auth-privacy.php

      # The runner includes MySQL and Chrome. The test creates its own data directory.
      - name: Check vault actions, master-password changes, and offline recovery
        run: node tests/master-password-change.cjs
